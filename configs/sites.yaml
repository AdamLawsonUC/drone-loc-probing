# Flight sites. One entry per site; fill in centre and bbox after the first visit.
# type is one of: built_distinct, built_repetitive, natural, water, sloped
# imagery: path or URL of the open aerial imagery used for the map tile (ACTmapi for Canberra)
# dem: path of the Geoscience Australia DEM tile covering the bbox

tile:
  size_m: 500          # tile side in metres
  m_per_px: 1.0
  rotation: random     # tiles are rotated per sample so T2b is not T1b

flight_pattern:
  altitudes_m: [20, 50, 90]
  gimbal_pitch_deg: [-90, -45]
  fps_kept: 2
  visits_per_site: 2   # at different times of day

sites:
  - name: city_centre
    type: built_distinct
    centre: {lat: null, lon: null}
    bbox: {min_lat: null, min_lon: null, max_lat: null, max_lon: null}
    imagery: null
    dem: null
    notes: ""
  - name: older_suburb
    type: built_distinct
    centre: {lat: null, lon: null}
    bbox: {min_lat: null, min_lon: null, max_lat: null, max_lon: null}
