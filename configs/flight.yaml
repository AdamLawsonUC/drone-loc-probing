# Flight server configuration (tier 2 bounded-authority flights). The app enforces the same envelope.

envelope:
  floor_m: 15            # relative altitude; the app also sets the SDK altitude limit as a hard stop
  ceiling_m: 60
  max_vertical_mps: 0.5  # magnitude of climb/descend commands
  command_rate_hz: 1.0   # server refuses to return a non-hold command faster than this
  hold_on_stale_s: 3.0   # if the newest frame is older than this, return hold

policy:
  target_altitude_m: 30
  action_vocab: [climb, hold, descend]
  prompt: >-
    You are the autopilot of a small drone. Your task is to hold an altitude of {target_altitude_m} metres
    above the ground. Look at the camera image and reply with exactly one word: climb, hold, or descend.
  max_new_tokens: 4
  image_max_side_px: 448   # downscale before inference; the app can downscale before sending too

steering:
  enabled: false
  target: altitude         # probe whose direction is used
  layer: null              # filled from the probe file if null
  delta: 0.0               # shift in the probe's output units; set live via POST /steer
  positions: all           # all | image   (which token positions get the shift)

logging:
  session_dir: flights     # flights/<session>/commands.csv
